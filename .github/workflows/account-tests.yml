name: Account and signaling tests

on:
  push:
    branches: [main, "codex/rankings-validation", "codex/cloud-saves", "codex/ranking-calendar-seasons"]
    paths: ["server/**", "tests/**", "package.json", "package-lock.json", ".github/workflows/account-tests.yml"]
  pull_request:
    paths: ["server/**", "tests/**", "package.json", "package-lock.json", ".github/workflows/account-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: qq_auth_tests
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QQ_AUTH_TEST_DATABASE_URL: postgres://postgres:ci-disposable-only@127.0.0.1:5432/qq_auth_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tools/tune_remaining_grades.mjs --check
      - name: Native Godot replay and exported-pack verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          node server/ranking/install-runtime.js
          export PATH="$PWD/server/ranking/vendor:$PATH"
          godot --version
          godot --headless --path . --editor --quit > build/import.log 2>&1
          godot --headless --path . res://tests/RemainingGradesSmoke.tscn --quit-after 1800 > build/remaining-grades.log 2>&1
          cat build/remaining-grades.log
          grep -q REMAINING_GRADES_SMOKE_OK build/remaining-grades.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/remaining-grades.log; then exit 1; fi
          godot --headless --path . res://tests/EchoRepeatSmoke.tscn --quit-after 600 > build/echo-repeat.log 2>&1
          cat build/echo-repeat.log
          grep -q ECHO_REPEAT_SMOKE_OK build/echo-repeat.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/echo-repeat.log; then exit 1; fi
          godot --headless --path . res://tests/RecastBalanceSmoke.tscn --quit-after 600 > build/recast-balance.log 2>&1
          cat build/recast-balance.log
          grep -q RECAST_BALANCE_SMOKE_OK build/recast-balance.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/recast-balance.log; then exit 1; fi
          godot --headless --path . res://tests/GradeBalanceSmoke.tscn --quit-after 600 > build/grade-balance.log 2>&1
          cat build/grade-balance.log
          grep -q GRADE_BALANCE_SMOKE_OK build/grade-balance.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/grade-balance.log; then exit 1; fi
          godot --headless --path . res://tests/ReservedCardsSmoke.tscn --quit-after 600 > build/reserved-cards.log 2>&1
          cat build/reserved-cards.log
          grep -q RESERVED_CARDS_SMOKE_OK build/reserved-cards.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/reserved-cards.log; then exit 1; fi
          godot --headless --path . res://tests/RegenerationSmoke.tscn --quit-after 600 > build/regeneration.log 2>&1
          cat build/regeneration.log
          grep -q REGENERATION_SMOKE_OK build/regeneration.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/regeneration.log; then exit 1; fi
          godot --headless --path . res://tests/DamageConversionSmoke.tscn --quit-after 600 > build/damage-conversion.log 2>&1
          cat build/damage-conversion.log
          grep -q DAMAGE_CONVERSION_SMOKE_OK build/damage-conversion.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/damage-conversion.log; then exit 1; fi
          godot --headless --path . res://tests/BalancePublicationSmoke.tscn --quit-after 600 > build/balance-publication.log 2>&1
          cat build/balance-publication.log
          grep -q BALANCE_PUBLICATION_SMOKE_OK build/balance-publication.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/balance-publication.log; then exit 1; fi
          godot --headless --path . res://tests/TimekeeperReworkSmoke.tscn --quit-after 600 > build/timekeeper-rework.log 2>&1
          cat build/timekeeper-rework.log
          grep -q TIMEKEEPER_REWORK_SMOKE_OK build/timekeeper-rework.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/timekeeper-rework.log; then exit 1; fi
          godot --headless --path . res://tests/BleedReworkSmoke.tscn --quit-after 600 > build/bleed-rework.log 2>&1
          cat build/bleed-rework.log
          grep -q BLEED_REWORK_SMOKE_OK build/bleed-rework.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/bleed-rework.log; then exit 1; fi
          godot --headless --path . res://tests/BalanceBulkSelectionSmoke.tscn --quit-after 600 > build/bulk-selection.log 2>&1
          cat build/bulk-selection.log
          grep -q BALANCE_BULK_SELECTION_SMOKE_OK build/bulk-selection.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/bulk-selection.log; then exit 1; fi
          godot --headless --path . res://tests/PublishedBalanceSmoke.tscn --quit-after 600 > build/published-balance.log 2>&1
          cat build/published-balance.log
          grep -q PUBLISHED_BALANCE_SMOKE_OK build/published-balance.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/published-balance.log; then exit 1; fi
          godot --headless --path . res://tests/UiCopySmoke.tscn --quit-after 600 > build/ui-copy.log 2>&1
          cat build/ui-copy.log
          grep -q UI_COPY_SMOKE_OK build/ui-copy.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/ui-copy.log; then exit 1; fi
          godot --headless --path . res://tests/SettingsModalSmoke.tscn --quit-after 1200 > build/settings-modal.log 2>&1
          cat build/settings-modal.log
          grep -q SETTINGS_MODAL_SMOKE_OK build/settings-modal.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/settings-modal.log; then exit 1; fi
          godot --headless --path . res://tests/MetaModalSmoke.tscn --quit-after 1200 > build/meta-modal.log 2>&1
          cat build/meta-modal.log
          grep -q META_MODAL_SMOKE_OK build/meta-modal.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/meta-modal.log; then exit 1; fi
          godot --headless --path . res://tests/TutorialModalSmoke.tscn --quit-after 2400 > build/tutorial-modal.log 2>&1
          cat build/tutorial-modal.log
          grep -q TUTORIAL_MODAL_SMOKE_OK build/tutorial-modal.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/tutorial-modal.log; then exit 1; fi
          godot --headless --path . res://tests/HubBackgroundSmoke.tscn --quit-after 600 > build/hub-background.log 2>&1
          cat build/hub-background.log
          grep -q HUB_BACKGROUND_SMOKE_OK build/hub-background.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/hub-background.log; then exit 1; fi
          godot --headless --path . res://tests/SmoothWheelSmoke.tscn --quit-after 1200 > build/smooth-wheel.log 2>&1
          cat build/smooth-wheel.log
          grep -q SMOOTH_WHEEL_SMOKE_OK build/smooth-wheel.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/smooth-wheel.log; then exit 1; fi
          godot --headless --path . res://tests/LanguageTransitionSmoke.tscn --quit-after 2400 > build/language-transition.log 2>&1
          cat build/language-transition.log
          grep -q LANGUAGE_TRANSITION_SMOKE_OK build/language-transition.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/language-transition.log; then exit 1; fi
          godot --headless --path . res://tests/BattlePresentationPerformanceSmoke.tscn --quit-after 2400 > build/battle-presentation.log 2>&1
          cat build/battle-presentation.log
          grep -q BATTLE_PRESENTATION_PERFORMANCE_SMOKE_OK build/battle-presentation.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/battle-presentation.log; then exit 1; fi
          godot --headless --path . res://tests/GradeFiveSmoke.tscn --quit-after 600 > build/grade-five.log 2>&1
          cat build/grade-five.log
          grep -q GRADE_FIVE_SMOKE_OK build/grade-five.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/grade-five.log; then exit 1; fi
          godot --headless --path . res://tests/BalanceLabSmoke.tscn --quit-after 600 > build/balance-lab.log 2>&1
          cat build/balance-lab.log
          grep -q BALANCE_LAB_SMOKE_OK build/balance-lab.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/balance-lab.log; then exit 1; fi
          godot --headless --path . res://tests/EncounterGrowthSmoke.tscn --quit-after 600 > build/encounter-growth.log 2>&1
          cat build/encounter-growth.log
          grep -q ENCOUNTER_GROWTH_SMOKE_OK build/encounter-growth.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/encounter-growth.log; then exit 1; fi
          godot --headless --path . res://tests/RankedRunSmoke.tscn --quit-after 600 > build/ranked-smoke.log 2>&1
          cat build/ranked-smoke.log
          grep -q RANKED_RUN_SMOKE_OK build/ranked-smoke.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/ranked-smoke.log; then exit 1; fi
          godot --headless --path . res://tests/RankedFacilitySmoke.tscn --quit-after 600 > build/ranked-facilities.log 2>&1
          cat build/ranked-facilities.log
          grep -q RANKED_FACILITY_SMOKE_OK build/ranked-facilities.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/ranked-facilities.log; then exit 1; fi
          godot --headless --path . res://tests/RankedOutboxSmoke.tscn --quit-after 600 > build/ranked-outbox.log 2>&1
          cat build/ranked-outbox.log
          grep -q RANKED_OUTBOX_SMOKE_OK build/ranked-outbox.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/ranked-outbox.log; then exit 1; fi
          mkdir -p build/cloud-test-home
          HOME="$PWD/build/cloud-test-home" godot --headless --path . res://tests/CloudProfileSmoke.tscn --quit-after 600 > build/cloud-profile.log 2>&1
          cat build/cloud-profile.log
          grep -q CLOUD_PROFILE_SMOKE_OK build/cloud-profile.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/cloud-profile.log; then exit 1; fi
          mkdir -p build/guest-test-home
          HOME="$PWD/build/guest-test-home" godot --headless --path . res://tests/GuestTransferSmoke.tscn --quit-after 600 > build/guest-transfer.log 2>&1
          cat build/guest-transfer.log
          grep -q GUEST_TRANSFER_SMOKE_OK build/guest-transfer.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' build/guest-transfer.log; then exit 1; fi
          godot --headless --path . --export-pack Web build/ranked-test.pck > build/export.log 2>&1
          godot --headless --main-pack build/ranked-test.pck res://scenes/ranking/Verifier.tscn -- "$PWD/build/ranked-fixture.json" > build/ranked-pack.log 2>&1
          cat build/ranked-pack.log
          node -e 'const fs=require("fs");const expected=JSON.parse(fs.readFileSync("build/ranked-fixture.json")).expected_score;const line=fs.readFileSync("build/ranked-pack.log","utf8").split(/\r?\n/).find(x=>x.startsWith("QQ_RANKED_RESULT "));const result=JSON.parse(line.slice(17));if(result.result?.total_score!==expected)throw Error("Ranked PCK replay mismatch");console.log("RANKED_NATIVE_PACK_REPLAY_OK");'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranked-validation-logs
          path: build/*.log
