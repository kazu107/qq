name: Account and signaling tests

on:
  push:
    branches: [main]
    paths: ["server/**", "tests/helpers/account_fixture.js", "package.json", "package-lock.json", ".github/workflows/account-tests.yml"]
  pull_request:
    paths: ["server/**", "tests/helpers/account_fixture.js", "package.json", "package-lock.json", ".github/workflows/account-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: qq_auth_tests
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QQ_AUTH_TEST_DATABASE_URL: postgres://postgres:ci-disposable-only@127.0.0.1:5432/qq_auth_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
