<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>QueueQuest</title>
		<link rel="icon" type="image/svg+xml" href="queuequest-mark.svg">
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background: #03070b;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	position: fixed;
	background: radial-gradient(circle at 50% 42%, #10263a 0%, #07111b 42%, #03070b 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: visible;
	opacity: 1;
	transition: opacity 900ms cubic-bezier(0.22, 1, 0.36, 1);
}

#status.is-complete {
	opacity: 0;
}

@media (prefers-reduced-motion: reduce) {
	#status {
		transition: none;
	}
}

#status::after {
	content: "";
	position: absolute;
	inset: 0;
	background-image: linear-gradient(rgba(84, 161, 205, 0.04) 1px, transparent 1px),
		linear-gradient(90deg, rgba(84, 161, 205, 0.04) 1px, transparent 1px);
	background-size: 36px 36px;
	pointer-events: none;
}

#status-splash {
	max-height: 36%;
	max-width: min(760px, 82%);
	margin: auto;
	z-index: 1;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-loading, #status-notice {
	z-index: 2;
}

#status-loading {
	position: absolute;
	bottom: 8%;
	width: min(520px, 82%);
	font: 500 14px/1.5 "Noto Sans JP", "Yu Gothic UI", sans-serif;
}

#status-heading {
	display: flex;
	align-items: baseline;
	justify-content: space-between;
	gap: 16px;
	margin-bottom: 10px;
	color: #b9d9e8;
	letter-spacing: 0.08em;
}

#status-percent {
	color: #f5c66a;
	font-size: 28px;
	font-weight: 700;
	font-variant-numeric: tabular-nums;
}

#status-progress {
	display: block;
	width: 100%;
	height: 8px;
	border: 1px solid #274557;
	border-radius: 8px;
	overflow: hidden;
	appearance: none;
	background: #081420;
	accent-color: #4ec9ff;
}

#status-progress::-webkit-progress-bar {
	background: #081420;
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #279bc5, #72d6f4);
	border-radius: 8px;
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #279bc5, #72d6f4);
	border-radius: 8px;
}

#status-detail {
	min-height: 3em;
	margin-top: 12px;
	color: #b9d9e8;
	text-align: center;
}

#status-transfer {
	min-height: 1.5em;
	color: #779bab;
	font-size: 12px;
	font-variant-numeric: tabular-nums;
	text-align: center;
}

#status-notice {
	display: none;
	background-color: #301d24;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #f0dfe3;
	font-family: "Noto Sans JP", "Yu Gothic UI", sans-serif;
	line-height: 1.5;
	margin: 0 2rem;
	max-width: 720px;
	overflow: hidden;
	padding: 1rem 1.25rem;
	text-align: center;
}

@media (max-height: 520px) {
	#status-splash {
		bottom: 38%;
		max-height: 28%;
	}
	#status-loading {
		bottom: 5%;
	}
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			JavaScriptを有効にしてください。
		</noscript>

		<div id="status" data-phase="download" role="status" aria-live="polite">
			<img id="status-splash" class="fullsize--true use-filter--true" src="queuequest-logo.svg" alt="QueueQuest">
			<div id="status-loading">
				<div id="status-heading"><span>読み込み状況</span><output id="status-percent" aria-label="全体の読み込み進捗">0%</output></div>
				<progress id="status-progress" max="1" value="0" aria-label="読み込み状況"></progress>
				<div id="status-detail">起動準備中</div>
				<div id="status-transfer"></div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":89903960,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const R2_MANIFEST_URL = 'https://qq.kazu107.xyz/releases/current.json';
const R2_ORIGIN = new URL(R2_MANIFEST_URL).origin;
const LOCAL_PACK_PATH = `${GODOT_CONFIG.executable}.pck`;

(function () {
	const statusOverlay = document.getElementById('status');
	const statusLoading = document.getElementById('status-loading');
	const statusProgress = document.getElementById('status-progress');
	const statusPercent = document.getElementById('status-percent');
	const statusNotice = document.getElementById('status-notice');
	const statusDetail = document.getElementById('status-detail');
	const statusTransfer = document.getElementById('status-transfer');

	let initializing = true;
	let statusMode = '';
	let overallProgress = 0;
	let bootProgressStarted = false;
	let legacyReadyPoll = null;
	const downloadWeight = 0.65;

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			initializing = false;
			statusMode = mode;
			statusOverlay.dataset.phase = 'ready';
			window.clearInterval(legacyReadyPoll);
			const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
			const fadeOut = () => {
				statusOverlay.classList.add('is-complete');
				if (reducedMotion) {
					statusOverlay.remove();
					return;
				}
				statusOverlay.addEventListener('transitionend', event => {
					if (event.target === statusOverlay && event.propertyName === 'opacity') statusOverlay.remove();
				});
				window.setTimeout(() => statusOverlay.remove(), 1000);
			};
			// Give the rendered Hub and the 100% status a frame before revealing them.
			window.requestAnimationFrame(() => window.setTimeout(fadeOut, reducedMotion ? 0 : 180));
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusLoading.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusDetail(text) {
		statusDetail.textContent = text;
	}

	function setOverallProgress(value, complete = false) {
		if (!Number.isFinite(value)) return;
		overallProgress = Math.max(overallProgress, Math.min(complete ? 1 : 0.99, Math.max(0, value)));
		statusProgress.max = 1;
		statusProgress.value = overallProgress;
		statusPercent.textContent = `${Math.floor(overallProgress * 100)}%`;
	}

	function updateBootProgress(text, progress) {
		if (!initializing || statusMode === 'notice') {
			return;
		}
		bootProgressStarted = true;
		statusOverlay.dataset.phase = 'preparing';
		setStatusMode('progress');
		setOverallProgress(downloadWeight + (1 - downloadWeight) * Number(progress));
		setStatusDetail(String(text));
		statusTransfer.textContent = '画像・音声・画面を準備しています';
	}

	function finishBoot() {
		if (!initializing || statusMode === 'notice') {
			return;
		}
		setOverallProgress(1, true);
		setStatusDetail('読み込み完了');
		statusTransfer.textContent = 'ハブを開いています';
		setStatusMode('hidden');
	}

	window.qqBootLoader = Object.freeze({ update: updateBootProgress, finish: finishBoot });

	function setStatusNotice(text) {
		statusNotice.replaceChildren();
		String(text).split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(error) {
		console.error(error);
		const message = error instanceof Error ? error.message : String(error || '不明なエラーが発生しました。');
		setStatusNotice(`ゲームを起動できませんでした。\n${message}\nページを再読み込みしてください。`);
		setStatusMode('notice');
		statusOverlay.dataset.phase = 'failed';
		window.clearInterval(legacyReadyPoll);
		initializing = false;
	}

	function useLocalPack() {
		const requestedPack = new URLSearchParams(window.location.search).get('pack');
		if (requestedPack === 'remote') {
			return false;
		}
		if (requestedPack === 'local') {
			return true;
		}
		return window.location.protocol === 'file:'
			|| ['localhost', '127.0.0.1', '0.0.0.0', '[::1]'].includes(window.location.hostname);
	}

	function validateManifest(manifest) {
		if (!manifest || manifest.schema_version !== 1 || !manifest.pck) {
			throw new Error('R2マニフェストの形式が正しくありません。');
		}
		const pckUrl = new URL(String(manifest.pck.url || ''));
		const sha256 = String(manifest.pck.sha256 || '').toLowerCase();
		const size = Number(manifest.pck.size);
		if (pckUrl.origin !== R2_ORIGIN || !/^[a-f0-9]{64}$/.test(sha256)) {
			throw new Error('R2マニフェストのPCK情報が正しくありません。');
		}
		if (!pckUrl.pathname.endsWith(`/objects/${sha256}.pck`) || !Number.isSafeInteger(size) || size <= 0) {
			throw new Error('R2マニフェストのPCKパスまたはサイズが正しくありません。');
		}
		return { source: pckUrl.toString(), size, remote: true };
	}

	async function fetchRemotePack() {
		const controller = new AbortController();
		const timeout = window.setTimeout(() => controller.abort(), 8000);
		try {
			const response = await fetch(R2_MANIFEST_URL, {
				cache: 'no-store',
				credentials: 'omit',
				signal: controller.signal,
			});
			if (!response.ok) {
				throw new Error(`R2マニフェストを取得できませんでした (${response.status})。`);
			}
			return validateManifest(await response.json());
		} finally {
			window.clearTimeout(timeout);
		}
	}

	async function resolvePack() {
		const localPack = {
			source: LOCAL_PACK_PATH,
			size: Number(GODOT_CONFIG.fileSizes[LOCAL_PACK_PATH] || 0),
			remote: false,
		};
		if (useLocalPack()) {
			return localPack;
		}
		setStatusDetail('ゲームデータを確認中');
		try {
			return await fetchRemotePack();
		} catch (error) {
			console.warn('R2 manifest unavailable; using the bundled PCK.', error);
			setStatusDetail('内蔵ゲームデータを使用します');
			return localPack;
		}
	}

	function updateProgress(current, total) {
		if (!initializing || bootProgressStarted) {
			return;
		}
		if (current > 0 && total > 0) {
			setOverallProgress(downloadWeight * current / total);
			setStatusDetail('ゲームデータをダウンロード中');
			const megabytes = bytes => (bytes / (1024 * 1024)).toFixed(1);
			statusTransfer.textContent = `${megabytes(Math.min(current, total))} / ${megabytes(total)} MB`;
		} else {
			setStatusDetail('ゲームデータを読み込み中');
			statusTransfer.textContent = 'ダウンロードを待っています';
		}
	}

	async function startGame() {
		setStatusMode('progress');
		const pack = await resolvePack();
		const fileSizes = Object.assign({}, GODOT_CONFIG.fileSizes, { [pack.source]: pack.size });
		const originalArgs = Array.isArray(GODOT_CONFIG.args) ? GODOT_CONFIG.args.slice() : [];
		const engine = new Engine(Object.assign({}, GODOT_CONFIG, {
			fileSizes,
			onProgress: updateProgress,
		}));

		if (pack.remote) {
			setStatusDetail('R2からゲームデータを読み込み中');
		}
		await Promise.all([
			engine.init(GODOT_CONFIG.executable),
			engine.preloadFile(pack.source, LOCAL_PACK_PATH),
		]);
		setOverallProgress(downloadWeight);
		statusOverlay.dataset.phase = 'initializing';
		setStatusDetail('起動準備中');
		statusTransfer.textContent = 'ゲームエンジンを初期化しています';
		await engine.start({ args: ['--main-pack', LOCAL_PACK_PATH].concat(originalArgs) });
		if (initializing) {
			// Previous R2 packs report readiness through metrics while the HTML release catches up.
			legacyReadyPoll = window.setInterval(() => {
				const metrics = window.qqLoadMetrics || [];
				if (metrics.some(entry => entry.event === 'boot_ready')
					&& metrics.some(entry => entry.event === 'scene_transition' && entry.details.screen === 'Hub')) {
					finishBoot();
				}
			}, 100);
		}
	}

	if (typeof Engine === 'undefined') {
		displayFailureNotice('起動に必要なファイルを読み込めませんでした。');
		return;
	}
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice(`必要なブラウザ機能が見つかりません。\n${missing.join('\n')}`);
		return;
	}
	startGame().catch(displayFailureNotice);
}());
		</script>
	</body>
</html>
