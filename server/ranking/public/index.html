<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QueueQuest | 無限ランキング</title><link rel="stylesheet" href="/account/style.css"><script src="/rankings/app.js" defer></script></head>
<body><main class="ranking-shell"><header><a class="brand" href="/"><img src="/queuequest-logo.svg" alt="QueueQuest"></a><a class="secondary" href="/account" data-en="Account">アカウント</a></header>
<section class="account-card"><h1 data-en="Infinite Rankings">無限ランキング</h1><p class="muted" data-en="No permanent upgrades; shared card and relic unlocks. Only server-verified personal bests are listed.">永続強化なし・全カード／遺物共通。サーバー検証済みの自己ベストだけを掲載します。</p>
<div class="actions"><label><span data-en="Season">シーズン</span> <select id="season"></select></label><label><span data-en="Rules">ルール</span> <select id="ruleset"></select></label><label><span data-en="Starter">開始デッキ</span> <select id="starter"><option value="" data-en="All">すべて</option></select></label><button id="refresh" data-en="Refresh">更新</button></div>
<p class="muted" data-en="One season per calendar month. Rule updates do not create seasons; select a rule version to view older records without mixing different balance conditions.">シーズンは月ごとに1つです。ルール更新前の記録は「ルール」で切り替えて確認できます。異なるバランス条件の順位は混ぜません。</p>
<p id="notice" role="status">読み込み中...</p><p id="self"></p><div class="ranking-scroll"><table><thead><tr><th>順位</th><th>ユーザー名</th><th>スコア</th><th>到達ステップ</th><th>デッキ</th><th>達成日時</th></tr></thead><tbody id="entries"></tbody></table></div>
<div class="actions"><button id="previous" class="secondary" data-en="Previous">前へ</button><span id="page"></span><button id="next" class="secondary" data-en="Next">次へ</button></div></section>
<section class="account-card ranking-history"><h2 data-en="Your Run History">自分の挑戦履歴</h2><p class="muted" data-en="Active, pending and ineligible runs are not official records. Seasons follow calendar months in Japan Standard Time.">中断中・送信待ち・検証待ち・対象外の記録は正式ランキングに含みません。シーズンは日本時間の月単位です。</p><div id="history"></div></section>
<dialog id="details"><h2 id="detail-name"></h2><pre id="detail-body"></pre><button id="close" data-en="Close">閉じる</button></dialog></main></body></html>
