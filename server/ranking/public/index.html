<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QueueQuest | 無限ランキング</title><link rel="stylesheet" href="/account/style.css"><script src="/rankings/app.js" defer></script></head>
<body><main class="ranking-shell"><header><a class="brand" href="/"><img src="/queuequest-logo.svg" alt="QueueQuest"></a><a class="secondary" href="/account" data-en="Account">アカウント</a></header>
<section class="account-card"><h1 data-en="Infinite Rankings" title="永続強化なし・全カード／遺物共通。サーバー検証済みの自己ベストだけを掲載します。" data-title-en="No permanent upgrades; shared card and relic unlocks. Only server-verified personal bests are listed.">無限ランキング</h1>
<div class="actions"><label><span data-en="Season">シーズン</span> <select id="season" title="無限モードの内容が変更されたときに次のシーズンが始まります。月替わりでは終了しません。" data-title-en="A new season starts when Infinite gameplay changes. Calendar months do not end a season."></select></label><label><span data-en="Starter">開始デッキ</span> <select id="starter"><option value="" data-en="All">すべて</option></select></label><button id="refresh" data-en="Refresh">更新</button></div>
<p id="notice" role="status">読み込み中...</p><p id="self"></p><div class="ranking-scroll"><table><thead><tr><th>順位</th><th>ユーザー名</th><th>スコア</th><th>到達ステップ</th><th>デッキ</th><th>達成日時</th></tr></thead><tbody id="entries"></tbody></table></div>
<div class="actions"><button id="previous" class="secondary" data-en="Previous">前へ</button><span id="page"></span><button id="next" class="secondary" data-en="Next">次へ</button></div></section>
<section class="account-card ranking-history"><h2 data-en="Your Run History" title="中断中・送信待ち・検証待ち・対象外の記録は正式ランキングに含みません。挑戦はシーズン終了前に確定してください。" data-title-en="Active, pending and ineligible runs are not official records. Finish a run before its season closes.">自分の挑戦履歴</h2><div id="history"></div></section>
<dialog id="details"><h2 id="detail-name"></h2><pre id="detail-body"></pre><button id="close" data-en="Close">閉じる</button></dialog></main></body></html>
